[package]
name = "xiic-book-studio"
version = "0.1.0"
description = "Local-first AI novel studio"
authors = ["xiic"]
edition = "2021"
default-run = "xiic-book-studio"

[lib]
name = "xiic_book_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
aes-gcm = "0.10"
axum = "0.8.6"
candle-core = { version = "0.11.0", features = ["metal"] }
candle-nn = { version = "0.11.0", features = ["metal"] }
candle-transformers = { version = "0.11.0", features = ["metal"] }
chrono = { version = "0.4.42", features = ["serde"] }
reqwest = { version = "0.12.24", features = ["json", "rustls-tls"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.25.0"
rusqlite = { version = "0.32.1", features = ["bundled", "load_extension"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tauri = { version = "2.11.2", default-features = false, features = ["wry"] }
tauri-plugin-opener = "2.5.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tempfile = "3.23.0"
tokenizers = "0.23.1"
base64 = "0.22"
rand = "0.8"
tower-http = { version = "0.6.6", features = ["cors"] }
ts-rs = { version = "11.1.0", features = ["serde-json-impl"] }

[dev-dependencies]
