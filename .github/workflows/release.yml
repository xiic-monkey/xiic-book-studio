name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-arm64:
    name: Build macOS Apple Silicon
    runs-on: macos-14
    env:
      XIIC_BUNDLE_TARGET_TRIPLE: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          key: macos-aarch64

      - name: Build Tauri app with local-search resources
        run: npm run tauri:build -- --target aarch64-apple-darwin --bundles app,dmg

      - name: Collect release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-dist
          find src-tauri/target/aarch64-apple-darwin/release/bundle -type f \( -name '*.dmg' -o -name '*.app.tar.gz' \) -exec cp {} release-dist/ \;
          test -n "$(find release-dist -type f -print -quit)"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-macos-aarch64
          path: release-dist
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-macos-arm64
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundle-macos-aarch64
          path: release-dist

      - uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
